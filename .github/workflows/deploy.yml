name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
        working-directory: ./frontend
      - run: npm run lint
        working-directory: ./frontend
      - run: npx tsc --noEmit
        working-directory: ./frontend
      # E2E tests require full stack (Strapi + PostgreSQL + Meilisearch).
      # Run locally: npm run test:e2e
      # Will be added to CI when staging environment is set up.
